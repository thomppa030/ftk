<svg width="180" height="270" viewBox="0 0 180 270" xmlns="http://www.w3.org/2000/svg">
  <rect width="180" height="270" rx="4" fill="#1e1f22"/>
  <!-- Back ridge -->
  <polyline points="0,137 25,110 45,120 65,100 90,117 115,104 135,112 155,97 180,137"
    fill="none" stroke="#D4A054" stroke-width="1.3" opacity="0.22"
    stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Mid ridge -->
  <polyline points="0,137 30,112 55,124 75,104 95,120 120,107 145,116 165,100 180,137"
    fill="none" stroke="#D4A054" stroke-width="1.8" opacity="0.45"
    stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Front ridge -->
  <polyline points="0,137 90,47 180,137"
    fill="none" stroke="#D4A054" stroke-width="2.5" opacity="1"
    stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Horizon -->
  <line x1="0" y1="137" x2="180" y2="137"
    stroke="#D4A054" stroke-width="0.8" opacity="0.3"/>
  <!-- Reflection: front -->
  <polyline points="0,137 90,227 180,137"
    fill="none" stroke="#D4A054" stroke-width="1.8" opacity="0.25"
    stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Reflection: mid -->
  <polyline points="0,137 30,162 55,150 75,170 95,154 120,167 145,158 165,174 180,137"
    fill="none" stroke="#D4A054" stroke-width="1.2" opacity="0.12"
    stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Reflection: back -->
  <polyline points="0,137 25,164 45,154 65,174 90,157 115,170 135,162 155,177 180,137"
    fill="none" stroke="#D4A054" stroke-width="0.8" opacity="0.06"
    stroke-linejoin="round" stroke-linecap="round"/>
</svg>
