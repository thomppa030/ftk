name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux (Ninja, GCC)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/linux-toolchain

      - name: Cache fetched dependencies
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: deps-linux-${{ hashFiles('cmake/FoundationDependencies.cmake', 'cmake/EngineDependencies.cmake') }}

      - name: Configure
        run: cmake --preset debug

      # Keeps going past a file that fails, so one run lists every file
      # that does rather than only the first.
      - name: Build
        run: cmake --build --preset debug -- -k 0

      - name: Bake engine fonts
        run: ./build/tools/fjimport/fjimport engine_assets/fonts/Inter.fjfont

      - name: Test
        run: ctest --test-dir build --output-on-failure

      # ftk's libraries on their own, as another program's build gets them:
      # they have to configure and build without the engine and its
      # dependencies. Reuses the sources the main build fetched.
      - name: Configure the libraries alone
        run: cmake --preset libraries

      - name: Build the libraries alone
        run: cmake --build --preset libraries

  # The unit tests under AddressSanitizer and UndefinedBehaviorSanitizer: a
  # read of freed memory or undefined behaviour fails the run here, where the
  # other jobs pass whenever the freed memory still happens to hold the old
  # value.
  linux-asan:
    name: Linux ASan (Ninja, GCC)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/linux-toolchain

      - name: Cache fetched dependencies
        uses: actions/cache@v4
        with:
          path: |
            build/_deps
            build-asan/_deps
          key: deps-linux-asan-${{ hashFiles('cmake/FoundationDependencies.cmake', 'cmake/EngineDependencies.cmake') }}

      # The asan preset builds from the imgui checkout the debug configure
      # fetches.
      - name: Configure
        run: |
          cmake --preset debug
          cmake --preset asan

      - name: Build the tests
        run: cmake --build --preset asan --target fjell-tests fjimport -- -k 0

      - name: Bake engine fonts
        run: ./build-asan/tools/fjimport/fjimport engine_assets/fonts/Inter.fjfont

      - name: Test
        working-directory: build-asan/tests
        run: ./fjell-tests

  windows:
    name: Windows (Ninja, MSVC)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      # Puts cl.exe and the MSVC toolchain on PATH so the Ninja generator
      # finds them without a Visual Studio developer prompt.
      - uses: ilammy/msvc-dev-cmd@v1

      - name: Install the Vulkan SDK
        uses: jakoch/install-vulkan-sdk-action@v1
        with:
          cache: true
          install_runtime: false
          # Keeps glslc, which the shader build and the runtime FJSL compiler
          # both invoke.
          stripdown: false

      - uses: lukka/get-cmake@v4.4.0
        with:
          cmakeVersion: "4.4.0"

      - name: Cache fetched dependencies
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: deps-windows-${{ hashFiles('cmake/FoundationDependencies.cmake', 'cmake/EngineDependencies.cmake') }}

      - name: Configure
        run: cmake --preset debug

      # Keeps going past a file that fails, so one run lists every file
      # that does rather than only the first.
      - name: Build
        run: cmake --build --preset debug -- -k 0

      - name: Bake engine fonts
        run: build\tools\fjimport\fjimport.exe engine_assets\fonts\Inter.fjfont

      - name: Test
        run: ctest --test-dir build --output-on-failure

      # ftk's libraries on their own, as another program's build gets them:
      # they have to configure and build without the engine and its
      # dependencies. Reuses the sources the main build fetched.
      - name: Configure the libraries alone
        run: cmake --preset libraries

      - name: Build the libraries alone
        run: cmake --build --preset libraries
