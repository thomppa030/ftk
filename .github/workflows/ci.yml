name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux (Ninja, GCC)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # SDL builds its X11 and Wayland video drivers from these headers and
      # loads the libraries at run time; the Wayland one generates protocol
      # sources with wayland-scanner. udev finds gamepads as they are plugged
      # in, D-Bus and IBus serve the desktop and text input.
      - name: Install build tools and windowing headers
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev \
            libxi-dev libxss-dev libxtst-dev libxkbcommon-dev \
            libwayland-dev libdecor-0-dev libdbus-1-dev libibus-1.0-dev libudev-dev

      - name: Install the Vulkan SDK
        run: |
          wget -qO- https://packages.lunarg.com/lunarg-signing-key-pub.asc \
            | sudo tee /etc/apt/trusted.gpg.d/lunarg.asc > /dev/null
          sudo wget -qO /etc/apt/sources.list.d/lunarg-vulkan-noble.list \
            https://packages.lunarg.com/vulkan/lunarg-vulkan-noble.list
          sudo apt-get update
          sudo apt-get install -y vulkan-sdk

      # The runner images ship a CMake older than this project's minimum.
      - uses: lukka/get-cmake@v4.4.0
        with:
          cmakeVersion: "4.4.0"

      - name: Cache fetched dependencies
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: deps-linux-${{ hashFiles('cmake/FoundationDependencies.cmake', 'cmake/EngineDependencies.cmake') }}

      - name: Configure
        run: cmake --preset debug

      - name: Build
        run: cmake --build --preset debug

      - name: Bake engine fonts
        run: ./build/tools/fjimport/fjimport engine_assets/fonts/Inter.fjfont

      - name: Test
        run: ctest --test-dir build --output-on-failure

      # Fjell's libraries on their own, as another program's build gets them:
      # they have to configure and build without the engine and its
      # dependencies. Reuses the sources the main build fetched.
      - name: Configure the libraries alone
        run: cmake --preset libraries

      - name: Build the libraries alone
        run: cmake --build --preset libraries

  windows:
    name: Windows (Ninja, MSVC)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      # Puts cl.exe and the MSVC toolchain on PATH so the Ninja generator
      # finds them without a Visual Studio developer prompt.
      - uses: ilammy/msvc-dev-cmd@v1

      - name: Install the Vulkan SDK
        uses: jakoch/install-vulkan-sdk-action@v1
        with:
          cache: true
          install_runtime: false
          # Keeps glslc, which the shader build and the runtime FJSL compiler
          # both invoke.
          stripdown: false

      - uses: lukka/get-cmake@v4.4.0
        with:
          cmakeVersion: "4.4.0"

      - name: Cache fetched dependencies
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: deps-windows-${{ hashFiles('cmake/FoundationDependencies.cmake', 'cmake/EngineDependencies.cmake') }}

      - name: Configure
        run: cmake --preset debug

      - name: Build
        run: cmake --build --preset debug

      - name: Bake engine fonts
        run: build\tools\fjimport\fjimport.exe engine_assets\fonts\Inter.fjfont

      - name: Test
        run: ctest --test-dir build --output-on-failure

      # Fjell's libraries on their own, as another program's build gets them:
      # they have to configure and build without the engine and its
      # dependencies. Reuses the sources the main build fetched.
      - name: Configure the libraries alone
        run: cmake --preset libraries

      - name: Build the libraries alone
        run: cmake --build --preset libraries
